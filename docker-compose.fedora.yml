services:
  db-postgres:
    image: postgres:15-alpine
    container_name: mtx-metal-erp-postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mtx_metal_erp

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: mtx-metal-erp_pgdata
